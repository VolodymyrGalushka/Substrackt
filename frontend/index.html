<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Substrackt</title>
    <script>
      // Paint the right palette before first paint. Wails sets GTK_THEME for a
      // dark desktop before GTK starts, so WebKitGTK's prefers-color-scheme is
      // reliable here; lib/theme.svelte.ts confirms it through the Go backend.
      (function () {
        try {
          var mode = localStorage.getItem("substrackt:theme");
          var dark;
          if (mode === "light") {
            dark = false;
          } else if (mode === "dark") {
            dark = true;
          } else {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
