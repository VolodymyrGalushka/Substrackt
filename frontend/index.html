<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Substrackt</title>
    <script>
      // Paint the last resolved theme before first paint. The real system value
      // is queried through Wails once the app mounts (WebKitGTK does not
      // reliably report prefers-color-scheme).
      (function () {
        try {
          var resolved = localStorage.getItem("substrackt:resolved-theme");
          document.documentElement.dataset.theme = resolved === "light" ? "light" : "dark";
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
