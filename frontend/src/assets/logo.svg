<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5bd7"/>
      <stop offset="1" stop-color="#232752"/>
    </linearGradient>
  </defs>

  <!-- squircle tile -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- renewal cycle: two 120-degree arcs with arrowheads, clockwise, r=320 -->
  <path d="M 222.0 376.7 A 320 320 0 0 1 774.1 328.4"
        fill="none" stroke="#f5f7ff" stroke-width="58" stroke-linecap="round"/>
  <polygon points="828.6,406.2 723.3,364.0 824.9,292.8" fill="#f5f7ff"/>

  <path d="M 802.0 647.3 A 320 320 0 0 1 249.9 695.6"
        fill="none" stroke="#35d0a0" stroke-width="58" stroke-linecap="round"/>
  <polygon points="195.4,617.8 300.7,660.0 199.1,731.2" fill="#35d0a0"/>

  <!-- card, slightly tilted -->
  <g transform="rotate(-6 512 512)">
    <rect x="362" y="417" width="300" height="190" rx="24" fill="#f5f7ff"/>
    <rect x="398" y="452" width="64" height="48" rx="10" fill="#4a5bd7"/>
    <rect x="398" y="548" width="150" height="22" rx="11" fill="#c9d1f2"/>
  </g>
</svg>
