# WARNING: this file is REGENERATED by `wails3 task common:update:build-assets`
# from the Wails template (values come from build/config.yml). Hand edits here
# are lost whenever that task runs — re-apply them, and expect the template's
# GTK4/WebKit6.0 depends to come back.

name: "substrackt"
arch: ${GOARCH}
platform: "linux"
version: "0.2.1"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Substrackt desktop app"
vendor: "Substrackt"
homepage: "https://github.com/VolodymyrGalushka/Substrackt"
license: "FSL-1.1-Apache-2.0"
release: "1"

contents:
  - src: "./bin/substrackt"
    dst: "/usr/local/bin/substrackt"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/substrackt.png"
  - src: "./build/linux/substrackt.desktop"
    dst: "/usr/share/applications/substrackt.desktop"

# The app builds with -tags gtk3, so it links the GTK3 + WebKit2GTK 4.1 stack
# (Ubuntu 22.04+, Debian 12+, Fedora 36+). If the build ever switches to the
# GTK4 + WebKitGTK 6.0 stack, replace these with:
#   depends: libgtk-4-1, libwebkitgtk-6.0-4
#   rpm: gtk4, webkitgtk6.0
#   archlinux: gtk4, webkitgtk-6.0
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

  # Arch Linux packages
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
